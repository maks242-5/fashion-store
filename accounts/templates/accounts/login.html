<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід — TechZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #0F172A; color: #F8FAFC;">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-4 p-4 rounded" style="background-color: #1E293B; border: 1px solid #334155;">
                <h3 class="mb-3 text-info">⚡ Вхід у TechZone</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Увійти</button>
                </form>
                <p class="mt-3 text-center mb-0">
                    <a href="{% url 'accounts:register' %}" class="text-info">Немає акаунту? Реєстрація</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
