<section class="featured-products">
    <h2>Хіти продажів</h2>
    <div class="product-grid">
        {% for product in featured_products %}
            <div class="product-card">
                <h3>{{ product.name }}</h3>
                <p>{{ product.price }} ₴</p>
                <a href="#" class="btn">Купити</a>
            </div>
        {% endfor %}
    </div>
</section>
