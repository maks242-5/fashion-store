<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замовлення прийнято — NovaStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --dk-bg: #0b0d12;
            --dk-surface: #121620;
            --dk-border: rgba(255, 255, 255, 0.12);
            --dk-border-strong: rgba(255, 255, 255, 0.28);
            --dk-text: #f3f4f6;
            --dk-accent: #e51937;
        }

        body {
            background: radial-gradient(circle at top right, #181e2c 0%, var(--dk-bg) 55%) !important;
            color: var(--dk-text) !important;
            font-family: 'Inter', sans-serif !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .dk-brand {
            color: #ffffff !important;
            font-weight: 800;
            letter-spacing: -0.4px;
            text-decoration: none;
        }

        .dk-brand span {
            color: var(--dk-accent);
        }

        .dk-success-card {
            max-width: 580px;
            background: var(--dk-surface);
            border: 1px solid var(--dk-border);
            border-radius: 18px;
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.55);
        }

        .dk-btn-dark {
            background: linear-gradient(180deg, #161b26 0%, #0b0e14 100%) !important;
            color: #ffffff !important;
            border: 1.5px solid var(--dk-border-strong) !important;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.14);
            transition: all 0.2s ease;
        }

        .dk-btn-dark:hover {
            background: linear-gradient(180deg, #1f2636 0%, #10141e 100%) !important;
            border-color: var(--dk-accent) !important;
            box-shadow: 0 12px 30px rgba(229, 25, 55, 0.25), 0 0 0 2px rgba(229, 25, 55, 0.35);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container py-5 text-center">
        <div class="dk-success-card p-4 p-md-5 mx-auto">
            <div class="mb-3">
                <a href="{% url 'catalog:product_list' %}" class="fs-4 dk-brand">Nova<span>Store</span></a>
            </div>
            <h1 class="h2 fw-bold text-success mb-3">✅ Дякуємо за замовлення!</h1>
            <p class="fs-5 text-white mb-2">
                Номер вашого замовлення: <strong style="color: #ff4d67;">#{{ order.id }}</strong>
            </p>
            <p class="text-secondary mb-4">
                Ми надіслали підтвердження на <strong class="text-light">{{ order.email }}</strong>. Найближчим часом менеджер зв’яжеться з вами.
            </p>
            <a href="{% url 'catalog:product_list' %}" class="btn dk-btn-dark rounded-pill px-5 py-3 fw-semibold">
                Повернутися до каталогу
            </a>
        </div>
    </div>
</body>
</html>
